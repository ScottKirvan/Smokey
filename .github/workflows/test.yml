name: Test

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'notes/CHANGELOG.md'
      - 'notes/VERSION.md'
      - '.github/release-please/**'

jobs:
  playwright:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 can't install browsers on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
